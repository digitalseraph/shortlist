{% extends "base.html" %}
{% block title %}Jobs — Shortlist{% endblock %}
{% block content %}
<div class="toolbar">
  <input
    type="search"
    name="q"
    value="{{ q }}"
    placeholder="filter by company or title…"
    hx-get="/p/{{ active.slug }}/"
    hx-trigger="keyup changed delay:300ms"
    hx-target="#job-tbody"
    hx-swap="innerHTML"
    hx-include="[name='min_score'],[name='max_age_days'],[name='remote_only'],[name='sort'],[name='dir']"
    hx-push-url="true"
  >
  <label>
    min score
    <input
      type="number"
      name="min_score"
      value="{{ min_score }}"
      min="0" max="100" size="4"
      hx-get="/p/{{ active.slug }}/"
      hx-trigger="change"
      hx-target="#job-tbody"
      hx-swap="innerHTML"
      hx-include="[name='q'],[name='max_age_days'],[name='remote_only'],[name='sort'],[name='dir']"
      hx-push-url="true"
    >
  </label>
  <label>
    <input
      type="checkbox"
      name="remote_only"
      value="true"
      {% if remote_only %}checked{% endif %}
      hx-get="/p/{{ active.slug }}/"
      hx-trigger="change"
      hx-target="#job-tbody"
      hx-swap="innerHTML"
      hx-include="[name='q'],[name='min_score'],[name='max_age_days'],[name='sort'],[name='dir']"
      hx-push-url="true"
    >
    remote only
  </label>
  <button
    hx-post="/p/{{ active.slug }}/rank/selected"
    hx-include=".job-select:checked"
    hx-target="#toast"
    hx-swap="innerHTML"
    title="LLM rerank the checked jobs — costs $$">Rank Selected (LLM)</button>
  <label>
    posted within
    <select
      name="max_age_days"
      hx-get="/p/{{ active.slug }}/"
      hx-trigger="change"
      hx-target="#job-tbody"
      hx-swap="innerHTML"
      hx-include="[name='q'],[name='min_score'],[name='remote_only'],[name='sort'],[name='dir']"
      hx-push-url="true"
    >
      {% for choice in max_age_choices %}
      <option value="{{ choice }}" {% if choice == max_age_days %}selected{% endif %}>
        {% if choice == 0 %}all time
        {% elif choice == 7 %}7 days
        {% elif choice == 30 %}30 days
        {% elif choice == 90 %}90 days
        {% elif choice == 365 %}1 year
        {% else %}{{ choice }} days{% endif %}
      </option>
      {% endfor %}
    </select>
  </label>
</div>

{% include "_joblist_table.html" %}

<script>
  // Select-all checkbox toggles every visible row checkbox. Re-bind on HTMX swap.
  function bindSelectAll() {
    const all = document.getElementById('select-all');
    if (!all) return;
    all.addEventListener('change', () => {
      document.querySelectorAll('.job-select').forEach(cb => { cb.checked = all.checked; });
    });
  }
  bindSelectAll();
  document.body.addEventListener('htmx:afterSwap', bindSelectAll);
</script>
{% endblock %}
