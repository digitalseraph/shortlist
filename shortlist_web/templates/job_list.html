{% extends "base.html" %}
{% block title %}Jobs — Shortlist{% endblock %}
{% block content %}
<div class="toolbar">
  <input
    type="search"
    name="q"
    value="{{ q }}"
    placeholder="filter by company or title…"
    hx-get="/"
    hx-trigger="keyup changed delay:300ms"
    hx-target="#job-tbody"
    hx-swap="innerHTML"
    hx-include="[name='min_score'],[name='max_age_days']"
  >
  <label>
    min score
    <input
      type="number"
      name="min_score"
      value="{{ min_score }}"
      min="0" max="100" size="4"
      hx-get="/"
      hx-trigger="change"
      hx-target="#job-tbody"
      hx-swap="innerHTML"
      hx-include="[name='q'],[name='max_age_days']"
    >
  </label>
  <label>
    posted within
    <select
      name="max_age_days"
      hx-get="/"
      hx-trigger="change"
      hx-target="#job-tbody"
      hx-swap="innerHTML"
      hx-include="[name='q'],[name='min_score']"
    >
      {% for choice in max_age_choices %}
      <option value="{{ choice }}" {% if choice == max_age_days %}selected{% endif %}>
        {% if choice == 0 %}all time
        {% elif choice == 7 %}7 days
        {% elif choice == 30 %}30 days
        {% elif choice == 90 %}90 days
        {% elif choice == 365 %}1 year
        {% else %}{{ choice }} days{% endif %}
      </option>
      {% endfor %}
    </select>
  </label>
</div>

{% include "_joblist_table.html" %}
{% endblock %}
