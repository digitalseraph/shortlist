<tr>
  <td class="select"><input type="checkbox" class="job-select" name="job_ids" value="{{ row.id }}"></td>
  <td class="score">{{ row.score_display }}</td>
  <td>{{ row.company }}</td>
  <td><a href="/p/{{ active.slug }}/job/{{ row.id }}">{{ row.title }}</a></td>
  <td class="dim">{{ row.location }}</td>
  <td class="comp">{{ row.comp_display }}</td>
  <td class="dim">{{ row.posted_display }}</td>
  <td><span class="badge status-{{ row.status }}">{{ row.status_display }}</span></td>
  <td>
    <button hx-post="/tailor/{{ row.id }}" hx-target="#toast" hx-swap="innerHTML">Tailor</button>
  </td>
  <td>
    <a href="{{ row.url }}" target="_blank" rel="noopener">Open</a>
  </td>
</tr>
