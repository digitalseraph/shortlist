<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shortlist{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    // HTMX 2.x by default refuses to swap 4xx/5xx responses, so error toasts
    // disappear silently. Tell it to swap on any HTTP error so the user sees
    // the same toast they'd see for a success.
    document.addEventListener('htmx:beforeOnLoad', (e) => {
      const x = e.detail.xhr;
      if (x.status >= 400) {
        e.detail.shouldSwap = true;
        e.detail.isError = false;
      }
    });
  </script>
</head>
<body>
  <header>
    <nav>
      <a href="/p/{{ active.slug }}/">Jobs</a>
      <a href="/p/{{ active.slug }}/applications">Applications</a>
      <a href="/p/{{ active.slug }}/costs">Costs</a>
      <a href="/p/{{ active.slug }}/settings">Settings</a>
    </nav>
    <select class="profile-switcher" onchange="location.href=this.value">
      {% for p in all_profiles %}
      <option value="/p/{{ p.slug }}/" {% if p.slug == active.slug %}selected{% endif %}>
        {{ p.display_name }}
      </option>
      {% endfor %}
      <option value="/profiles">Manage people…</option>
    </select>
    <div class="actions">
      <button hx-post="/p/{{ active.slug }}/fetch" hx-target="#toast" hx-swap="innerHTML">Fetch</button>
      <button hx-post="/p/{{ active.slug }}/rank?mode=no-llm" hx-target="#toast" hx-swap="innerHTML"
              title="cosine score every job — free">Rank All</button>
      <button hx-post="/p/{{ active.slug }}/jobs/purge-untailored"
              hx-target="#toast" hx-swap="innerHTML"
              hx-confirm="Delete all jobs except tailored ones? This cannot be undone."
              class="danger"
              title="keep tailored jobs only — destructive">Purge Untailored</button>
    </div>
  </header>
  <div id="toast"></div>
  <div id="status-feed" hx-get="/p/{{ active.slug }}/status" hx-trigger="load, every 2s" hx-swap="innerHTML"></div>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
