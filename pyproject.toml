[project]
name = "shortlist"
version = "0.0.1"
description = "Personal job-search assistant: discover, rank, tailor, track."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "David Miller", email = "davidmiller.avatar@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "platformdirs>=4.2",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "anthropic>=0.40",
    "numpy>=1.26",
    "textual>=0.85",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "textual-dev>=1.7",
]

[project.scripts]
shortlist = "shortlist.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortlist", "shortlist_tui"]

[tool.hatch.build.targets.wheel.force-include]
"shortlist/templates/pdf-template.tex" = "shortlist/templates/pdf-template.tex"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["shortlist", "shortlist_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "strict"
markers = [
    "browser: tests requiring a real browser (Playwright); not run in CI",
    "live: tests hitting live network APIs; gated by RUN_LIVE=1",
]
